<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Auction Watchlist</title><link rel="stylesheet" href="popup.css" /></head>
  <body><main><header><div><p class="eyebrow">AUCTION WATCHLIST</p><h1>Keep the close in view.</h1></div><button id="settings" class="icon-button" aria-label="Extension settings">⚙</button></header><section id="connection" class="panel hidden"><strong>Connect your watchlist</strong><p>Enter your dashboard address and one-time extension token in settings.</p><button id="connect">Open settings</button></section><section id="page" class="panel hidden"><p class="label">CURRENT PAGE</p><h2 id="page-title">Auction listing</h2><p id="page-source" class="muted"></p><button id="save" class="primary">Save to watchlist</button></section><section id="recent" class="panel hidden"><div class="section-head"><p class="label">RECENT SAVES</p><button id="refresh" class="text-button">Refresh</button></div><div id="recent-list" class="list"></div></section><p id="notification-state" class="status"></p><p id="status" role="status" class="status"></p><footer><button id="open-dashboard" class="text-button">Open full dashboard ↗</button></footer></main><script src="popup.js"></script></body>
</html>
